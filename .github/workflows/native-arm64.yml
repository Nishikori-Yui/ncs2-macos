name: Native physical Mac reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: [self-hosted, macOS, ARM64, ncs2-physical]
    timeout-minutes: 90
    steps:
      - name: Fetch the requested source revision
        shell: /bin/zsh -euo pipefail {0}
        run: |
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          [[ "$GITHUB_REPOSITORY" =~ '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' ]]
          [[ "$GITHUB_SHA" =~ '^[0-9a-f]{40}$' ]]
          task_dir="$(mktemp -d "$RUNNER_TEMP/ncs2-physical.XXXXXX")"
          print -r -- "NCS2_CI_TASK_DIR=$task_dir" >> "$GITHUB_ENV"
          {
            git init --quiet "$task_dir/source"
            git -C "$task_dir/source" fetch --quiet --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
            git -C "$task_dir/source" checkout --quiet --detach FETCH_HEAD
          } > "$task_dir/source-fetch.log" 2>&1
      - name: Reproduce without cached runtime or firmware
        shell: /bin/zsh -euo pipefail {0}
        run: |
          cd "$NCS2_CI_TASK_DIR/source"
          python3 -B scripts/reproduce_macos.py --output "$NCS2_CI_TASK_DIR/local-results" --timeout 4800 --summary-only > "$NCS2_CI_TASK_DIR/summary.json"
          cat "$NCS2_CI_TASK_DIR/summary.json"
          cat "$NCS2_CI_TASK_DIR/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Show sanitized failure summary
        if: failure()
        shell: /bin/zsh -euo pipefail {0}
        run: |
          if [[ -n "${NCS2_CI_TASK_DIR:-}" && -f "$NCS2_CI_TASK_DIR/summary.json" ]]; then
            cat "$NCS2_CI_TASK_DIR/summary.json"
          fi
          print -- 'Raw commands, logs, dependencies and firmware remain on the self-hosted Mac. No artifacts are uploaded.'
